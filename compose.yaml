# Démarrer la machine :        docker compose up -d --build
# Ouvrir un terminal dedans :  docker compose exec node bash
# Éteindre la machine :        docker compose down
services:
  node:
    build: .
    image: tp-nodejs:24
    container_name: tp-nodejs
    working_dir: /work
    init: true
    tty: true
    stdin_open: true
    volumes:
      # le dépôt est partagé : ce que vous éditez dans VS Code est visible dans la machine
      - .:/work
    ports:
      # le serveur lancé dans la machine (port 3000) est joignable sur http://localhost:3000
      - "3000:3000"
